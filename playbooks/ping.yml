---
- name: Test Linux connectivity and get system info
  hosts: linux
  gather_facts: false

  tasks:
    - name: Ping Linux server
      ansible.builtin.ping:

    - name: Gather Linux hardware facts
      ansible.builtin.setup:
        gather_subset:
          - hardware

    - name: Display Linux CPU, RAM, and Disk info
      ansible.builtin.debug:
        msg:
          - "CPU Cores: {{ ansible_processor_vcpus | default('N/A') }}"
          - "Total RAM (MB): {{ ansible_memtotal_mb | default('N/A') }}"
          - "Free RAM (MB): {{ ansible_memfree_mb | default('N/A') }}"
          - "Disks (GB): {{ ansible_mounts | selectattr('size_total', 'defined') | map(attribute='mount') | zip(ansible_mounts | selectattr('size_total', 'defined') | map(attribute='size_total') | map('filesizeformat')) | list }}"

- name: Test Windows connectivity and get system info
  hosts: windows
  gather_facts: false

  tasks:
    - name: Ping Windows server
      ansible.windows.win_ping:

    - name: Gather Windows hardware facts
      ansible.windows.setup:
        gather_subset:
          - hardware

    - name: Display Windows CPU, RAM, and Disk info
      ansible.builtin.debug:
        msg:
          - "CPU Cores: {{ ansible_processor_vcpus | default('N/A') }}"
          - "Total RAM (MB): {{ ansible_memtotal_mb | default('N/A') }}"
          - "Free RAM (MB): {{ ansible_memfree_mb | default('N/A') }}"
          - "Disks: {{ ansible_facts['disks'] | default('No disk facts returned') }}"
