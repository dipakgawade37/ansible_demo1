---
- name: Test Linux connectivity and get system info
  hosts: linux
  gather_facts: true

  tasks:
    - name: Ping Linux server
      ansible.builtin.ping:

    - name: Display Linux CPU, RAM, and Disk info
      ansible.builtin.debug:
        msg:
          - "CPU Cores: {{ ansible_processor_vcpus }}"
          - "Total RAM (MB): {{ ansible_memtotal_mb }}"
          - "Free RAM (MB): {{ ansible_memfree_mb }}"
          - "Disks: {{ ansible_mounts | map(attribute='mount') | zip(ansible_mounts | map(attribute='size_total')) | list }}"

- name: Test Windows connectivity and get system info
  hosts: windows
  gather_facts: true

  tasks:
    - name: Ping Windows server
      ansible.windows.win_ping:

    - name: Display Windows CPU, RAM, and Disk info
      ansible.builtin.debug:
        msg:
          - "CPU Cores: {{ ansible_processor_vcpus }}"
          - "Total RAM (MB): {{ ansible_memtotal_mb }}"
          - "Free RAM (MB): {{ ansible_memfree_mb }}"
          - "Disks (Bytes): {{ ansible_facts['disks'] | default(ansible_mounts) }}"
